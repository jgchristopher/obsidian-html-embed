name: release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag must match manifest and package versions
        run: |
          test "$GITHUB_REF_NAME" = "$(node -p 'require("./manifest.json").version')"
          test "$GITHUB_REF_NAME" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css
          --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
